version: "3.4"

services:
  api:
    container_name: LibreChat
    ports:
      - "${PORT}:${PORT}"
    depends_on:
      - mongodb
      - rag_api
    image: ghcr.io/danny-avila/librechat:latest
    restart: always
    user: "${UID}:${GID}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - HOST=0.0.0.0
      - MONGO_URI=mongodb://mongodb:27017/LibreChat
      - MEILI_HOST=http://meilisearch:7700
      - RAG_PORT=${RAG_PORT:-8000}
      - RAG_API_URL=http://rag_api:${RAG_PORT:-8000}
      - ADMIN_EMAIL=mohamedabdelatti30@gmail.com
      - ALLOW_ADMIN_REGISTRATION=true
    env_file:
      - .env
    volumes:
      - type: bind
        source: ./.env
        target: /app/.env
      - type: bind
        source: ./librechat.yaml
        target: /app/librechat.yaml
      - ./images:/app/client/public/images
      - ./logs:/app/api/logs
  mongodb:
    container_name: chat-mongodb
    image: mongo
    restart: always
    user: "${UID}:${GID}"
    volumes:
      - ./data-node:/data/db
    command: mongod --noauth
  meilisearch:
    container_name: chat-meilisearch
    image: getmeili/meilisearch:v1.7.3
    restart: always
    user: "${UID}:${GID}"
    environment:
      - MEILI_HOST=http://meilisearch:7700
      - MEILI_NO_ANALYTICS=true
    volumes:
      - ./meili_data_v1.7:/meili_data
  vectordb:
    container_name: vectordb
    image: ankane/pgvector:latest
    environment:
      POSTGRES_DB: mydatabase
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
    restart: always
    volumes:
      - pgdata2:/var/lib/postgresql/data
  rag_api:
    container_name: rag_api
    image: ghcr.io/danny-avila/librechat-rag-api-dev-lite:latest
    environment:
      - DB_HOST=vectordb
      - RAG_PORT=${RAG_PORT:-8000}
    restart: always
    depends_on:
      - vectordb
    env_file:
      - .env
  admin-dashboard:
    build: https://github.com/innFactory/librechat-admin-dashboard.git#main
    container_name: librechat-admin-dashboard
    expose:
      - "3000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/LibreChat
      - MONGODB_DB_NAME=LibreChat
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD}
      # الـ 3 سطور الجداد لحل مشكلة الـ 401 والشاشة البيضاء
      - NEXTAUTH_URL=https://admin-ai.qraura.shop/dashboard
      - NEXTAUTH_SECRET=AuraQrSuperSecretKey2026!
      - SESSION_SECRET=AuraQrSuperSecretKey2026!
    restart: always
    depends_on:
      - mongodb
      
volumes:
  pgdata2:
