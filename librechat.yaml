version: 1.2.1
cache: true
endpoints:
  custom:
    - name: "OpenRouter"
      apiKey: "user_provided"
      baseURL: "https://openrouter.ai/api/v1"
      models:
        default: ["google/gemini-2.0-flash-001", "anthropic/claude-3.5-sonnet", "openai/gpt-4o"]
        fetch: true
      titleConvo: true
      titleModel: "google/gemini-2.0-flash-001"
      modelDisplayLabel: "OpenRouter"
    - name: "ChatGPT (OpenAI)"
      apiKey: "user_provided"
      baseURL: "https://api.openai.com/v1"
      models:
        default: ["gpt-4o", "gpt-4-turbo", "gpt-3.5-turbo"]
        fetch: true
    - name: "Gemini (Google)"
      apiKey: "user_provided"
      baseURL: "https://generativelanguage.googleapis.com/v1beta/openai/"
      models:
        default: ["gemini-pro", "gemini-1.5-flash"]
        fetch: true
